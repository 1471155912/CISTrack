name: Update wiki stats

# 每天两次（北京时间 04:00 / 16:00 = UTC 20:00 / 08:00）自动抓取卫星百科词条，
# 更新 wiki.json 顶部的词条统计。也可在 Actions 页面手动触发。
# 注意：GitHub 的定时任务可能有几分钟的调度延迟。
# 说明：Cloudflare 会拦截 GitHub 数据中心 IP（"Just a moment..." 挑战页过不去），
# 所以无法在 Actions 上直接抓取 —— 定时已移除，仅保留手动触发备用。
# 实际的自动更新由发布方的本地任务执行 scripts/fetch_wiki.mjs（非数据中心出口可过 WAF）。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm i playwright --no-save
          npx playwright install --with-deps chromium

      # ★ V1.9.9.630：把 Playwright 装的 chromium **显式告诉抓取脚本**。
      #   为什么必须显式传（曾经的坑）：`scripts/cdp.mjs` 的 findBrowser() 查的是
      #   "常见安装路径 + Playwright/Puppeteer 缓存目录"。ubuntu-latest **不预装** Edge/Chrome，
      #   浏览器只存在于 `~/.cache/ms-playwright/…`。只靠缓存探测虽然现在能命中，
      #   但一旦 Playwright 换了目录布局（历史上改过 chrome-linux → chrome-linux64），
      #   就会退化成"装了却报没装"。这里用 Playwright 自己的 API 拿**权威路径**，
      #   缓存探测只作兜底 —— 两重保险。
      #   （该 API 在本版本必存在；取不到时留空即走兜底，不因此中断。）
      - name: 指定浏览器路径（供 cdp.mjs 使用）
        run: |
          # ⚠️ 这里**不能用** P="$(node -e "...")" 的写法：外层双引号里的 `"` 会提前闭合，
          #    命令被截断成 `node -e try{...}`（语法错）。改写成 heredoc 传入脚本，引号不再打架。
          P="$(node <<'NODEJS'
          try { process.stdout.write(require('playwright').chromium.executablePath()); } catch (e) { /* 走兜底 */ }
          NODEJS
          )" 2>/dev/null || P=""
          if [ -n "$P" ] && [ -x "$P" ]; then
            echo "CISTRACK_EDGE=$P" >> "$GITHUB_ENV"
            echo "已指定浏览器：$P"
          else
            echo "⚠ 未能从 playwright API 取到可执行路径，将回退到 cdp.mjs 的缓存探测"
          fi

      - name: Fetch & parse wiki stats
        run: node scripts/fetch_wiki.mjs

      # ★ V1.9.7（§23.3-d 的同款闸门）：这个 workflow 是**手动触发、只改 wiki.json、不构建产物**，
      #   所以加 smoke 意义不大；但它**推送前没有任何校验** —— 一旦抓取解析出错（例如 WAF 挑战页被当成数据），
      #   坏结构会直接进 main，再被下一次构建消费。这里做最小结构校验，不合格就不提交。
      - name: 校验 wiki.json 结构（必填字段 + 数值类型）
        run: |
          node -e '
          const w = require("./wiki.json");
          const ok = k => w[k] && typeof w[k].asOf === "string" && w[k].asOf
            && w[k].launched && typeof w[k].launched.n === "number" && isFinite(w[k].launched.n)
            && w[k].inOrbit && typeof w[k].inOrbit.n === "number" && isFinite(w[k].inOrbit.n);
          if (!ok("gw") || !ok("qf")) { console.error("wiki.json 结构不合格，拒绝提交"); process.exit(1); }
          console.log("wiki.json 结构 OK:", w.gw.asOf, "/", w.qf.asOf);
          '
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki.json
          if git diff --cached --quiet; then
            echo "统计无变化，无需提交"
          else
            git commit -m "wiki.json: 自动更新词条统计（$(date -u +'%Y-%m-%d %H:%M UTC')）"
            git push
          fi
